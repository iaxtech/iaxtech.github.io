<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Página não encontrada | IA-XTECH</title>
  <link rel="icon" type="image/png" href="assets/img/logo-quadrada.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <style>
    .error-page{min-height:100vh;display:grid;place-items:center;padding:32px;text-align:center;background:#07110d}
    .error-card{max-width:720px;padding:48px;border:1px solid rgba(139,209,63,.25);border-radius:28px;background:rgba(255,255,255,.04);box-shadow:0 30px 80px rgba(0,0,0,.35)}
    .error-card img{width:120px;margin-bottom:20px}.error-card h1{font-size:clamp(2.2rem,7vw,5rem);margin:0 0 12px}.error-card p{color:#aab8b0;margin:0 auto 28px;max-width:560px}
  </style>
</head>
<body>
  <main class="error-page">
    <section class="error-card">
      <img src="assets/img/logo-sem-fundo.png" alt="IA-XTECH">
      <span class="kicker">Erro 404</span>
      <h1>Página não encontrada</h1>
      <p>O endereço acessado não existe ou foi alterado. Volte para o site da IA-XTECH e conheça nossas soluções para Food Service.</p>
      <a class="btn btn-primary" href="./">Voltar para o início →</a>
    </section>
  </main>
</body>
</html>
